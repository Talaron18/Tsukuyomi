<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsukuyomi live VRM</title>
<style>
  :root { --bg: #16171b; --fg: #e8e6e3; --dim: #8a8d94; --acc: #7fb4ff; --panel: #202228; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  #stages { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .stage { position: relative; flex: 1 1 320px; max-width: 540px; aspect-ratio: 1;
           background: #000; border-radius: 8px; overflow: hidden; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .label { position: absolute; left: 8px; top: 6px; color: var(--dim); font-size: 12px; }
  #sub { text-align: center; min-height: 1.6em; margin: 8px auto 0; max-width: 900px;
         font-size: clamp(16px, 2.6vw, 22px); }
  #hint { position: fixed; inset: 0; display: flex; align-items: center;
          justify-content: center; background: rgba(0,0,0,.45); cursor: pointer;
          font-size: 18px; z-index: 2; }
  form { display: flex; gap: 8px; margin: 12px auto; max-width: 640px; }
  #line { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 6px;
          border: 1px solid #3a3d45; background: var(--panel); color: var(--fg); font-size: 16px; }
  button { padding: 10px 16px; border-radius: 6px; border: 0; background: var(--acc);
           color: #0b1220; font-weight: 600; font-size: 15px; cursor: pointer; }
  #hud { max-width: 900px; margin: 0 auto; color: var(--dim); font-size: 12px;
         font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  #log { max-width: 900px; margin: 8px auto; height: 220px; overflow: auto; padding: 8px;
         background: var(--panel); border-radius: 6px; font-size: 12px;
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .you { color: var(--acc); }
</style>
<script type="importmap">
{"imports": {
  "three": "/web/vendor/three/build/three.module.min.js",
  "three/addons/": "/web/vendor/three/examples/jsm/",
  "@pixiv/three-vrm": "/web/vendor/three-vrm/three-vrm.module.min.js"
}}
</script>
</head>
<body>
<main>
  <div id="stages">
    <div class="stage" id="l2dStage" hidden><canvas id="cv" width="512" height="512"></canvas><div class="label">Live2D</div></div>
    <div class="stage"><canvas id="vcv" width="512" height="512"></canvas><div class="label">VRM</div></div>
  </div>
  <div id="sub"></div>
  <div id="hint">click to start (the browser needs a click before it plays sound)</div>
  <form id="form"><input id="line" autocomplete="off" placeholder="say something"
         aria-label="your line"><button>send</button></form>
  <div id="hud">connecting...</div>
  <div id="log"></div>
</main>
<script type="module">
// flow.live --avatar vrm / both. The clock, audio and subtitles work as on
// the Live2D page (flow/live.html): every item carries a server-clock time
// and plays at server time + DELAY. The VRM is drawn here from the body
// states on /states (one per server frame, flow.vrmbody state()), the state
// for "now" interpolated between the two around it; with --avatar both the
// Live2D frames from /video are drawn beside it on the same delay.
import { loadAvatar, applyState, draw, lerpState } from "/web/vrm.js";
const P = new URLSearchParams(location.search);
const DELAY = parseFloat(P.get("delay") || "0.3");
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const vcv = document.getElementById("vcv");
const subEl = document.getElementById("sub"), hud = document.getElementById("hud");
const logEl = document.getElementById("log"), hint = document.getElementById("hint");
let offset = null, rtt = null, av = null, cfg = null;
const pings = [], frames = [], subs = [], late = [], states = [];
let ctx = null, pendingAudio = [], shown = 0, lastShown = 0, fpsSeen = 0, lastDraw = null;

const now = () => performance.now() / 1000;
const localAt = ts => ts - offset + DELAY;

async function ping() {
  try {
    const t0 = now();
    const j = await (await fetch("/clock", {cache: "no-store"})).json();
    const t1 = now();
    pings.push({rtt: t1 - t0, off: j.t - (t0 + t1) / 2});
    if (pings.length > 30) pings.shift();
    const b = pings.reduce((a, c) => (c.rtt < a.rtt ? c : a));
    offset = b.off; rtt = b.rtt;
  } catch (e) { /* keep the last estimate */ }
}

function startAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state !== "running") ctx.resume();
  hint.style.display = "none";
  const p = pendingAudio; pendingAudio = [];
  p.forEach(playAudio);
}
hint.addEventListener("click", startAudio);

function ctxTimeFor(localS) {
  if (ctx.getOutputTimestamp) {
    const o = ctx.getOutputTimestamp();
    if (o.performanceTime) return o.contextTime + (localS - o.performanceTime / 1000);
  }
  return ctx.currentTime + (localS - now()) - (ctx.outputLatency || ctx.baseLatency || 0);
}

async function playAudio(ev) {
  if (!ctx || ctx.state !== "running" || offset === null) { pendingAudio.push(ev); return; }
  try {
    const data = await (await fetch(ev.url, {cache: "no-store"})).arrayBuffer();
    const buf = await ctx.decodeAudioData(data);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    const when = ctxTimeFor(localAt(ev.t));
    const lag = ctx.currentTime - when;
    if (lag <= 0) src.start(when);
    else if (lag < buf.duration) src.start(0, lag);
  } catch (e) { log("audio: " + e); }
}

function log(text, cls) {
  const d = document.createElement("div");
  d.textContent = text; if (cls) d.className = cls;
  logEl.appendChild(d);
  while (logEl.childNodes.length > 300) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

function onEvent(m) {
  if (m.type === "audio") playAudio(m);
  else if (m.type === "sub") subs.push(m);
  else if (m.type === "user") log("you: " + m.text, "you");
  else if (m.type === "log") log(m.text);
  else if (m.type === "reply") {
    const s = m.sentences || [];
    log("reply: " + (m.reply || "").trim() + "  [model "
        + (m.model_first_text == null ? "-" : m.model_first_text.toFixed(2)) + " s, first audio "
        + (s.length ? s[0].audio_at.toFixed(2) : "-") + " s]");
  }
}

function events() {
  const es = new EventSource("/events");
  es.onmessage = e => onEvent(JSON.parse(e.data));
}

function stateStream() {
  const es = new EventSource("/states");
  es.onmessage = e => {
    const st = JSON.parse(e.data);
    if (offset !== null) { late.push(now() - (st.t - offset)); if (late.length > 90) late.shift(); }
    let i = states.length;
    while (i > 0 && states[i - 1].t > st.t) i--;
    states.splice(i, 0, st);
    while (states.length > 240) states.shift();
  };
}

async function video() {           // --avatar both: the Live2D frames
  try {
    const r = await fetch("/video", {cache: "no-store"});
    const rd = r.body.getReader();
    let buf = new Uint8Array(0);
    for (;;) {
      const {value, done} = await rd.read();
      if (done) break;
      const nb = new Uint8Array(buf.length + value.length);
      nb.set(buf); nb.set(value, buf.length); buf = nb;
      while (buf.length >= 20) {
        const dv = new DataView(buf.buffer, buf.byteOffset, 20);
        const n = dv.getUint32(16, true);
        if (buf.length < 20 + n) break;
        const ts = dv.getFloat64(8, true);
        const jpg = buf.slice(20, 20 + n);
        buf = buf.slice(20 + n);
        createImageBitmap(new Blob([jpg], {type: "image/jpeg"})).then(bm => {
          let i = frames.length;
          while (i > 0 && frames[i - 1].ts > ts) i--;
          frames.splice(i, 0, {ts, bm});
          while (frames.length > 120) frames.shift().bm.close();
        });
      }
    }
  } catch (e) { /* reconnect below */ }
  setTimeout(video, 1000);
}

function frameAt(ts) {
  // The two states around server time ts, interpolated.
  while (states.length > 2 && states[1].t <= ts) states.shift();
  if (!states.length) return null;
  const a = states[0], b = states[1];
  if (!b || ts <= a.t) return a;
  return lerpState(a, b, (ts - a.t) / Math.max(b.t - a.t, 1e-6));
}

function drawLoop() {
  requestAnimationFrame(drawLoop);
  if (offset === null) return;
  const t = now();
  const ts = t + offset - DELAY;               // the server time on screen now
  if (av) {
    const st = frameAt(ts);
    if (st) {
      const dt = lastDraw === null ? 1 / 60 : Math.min(t - lastDraw, 0.1);
      lastDraw = t;
      applyState(av, st, dt);
      draw(av);
      shown++;
    }
  }
  if (cfg && cfg.avatar === "both") {
    let pick = null;
    while (frames.length && localAt(frames[0].ts) <= t) { if (pick) pick.bm.close(); pick = frames.shift(); }
    if (pick) {
      if (cv.width !== pick.bm.width) { cv.width = pick.bm.width; cv.height = pick.bm.height; }
      g.drawImage(pick.bm, 0, 0); pick.bm.close();
    }
  }
  let text = "";
  for (let i = subs.length - 1; i >= 0; i--) {
    const s = subs[i];
    if (localAt(s.end) < t - 10) { subs.splice(i, 1); continue; }
    if (localAt(s.t) <= t && t < localAt(s.end)) { text = s.text; break; }
  }
  if (subEl.textContent !== text) subEl.textContent = text;
}

setInterval(() => {
  fpsSeen = shown - lastShown; lastShown = shown;
  const sorted = late.slice().sort((a, b) => a - b);
  const p95 = sorted.length ? sorted[Math.floor(sorted.length * 0.95)] : NaN;
  hud.textContent = "clock offset " + (offset == null ? "-" : offset.toFixed(3)) + " s, ping "
    + (rtt == null ? "-" : (1000 * rtt).toFixed(0)) + " ms; states arrive "
    + (isNaN(p95) ? "-" : (1000 * p95).toFixed(0)) + " ms after their time (p95), delay "
    + (1000 * DELAY).toFixed(0) + " ms" + (p95 > DELAY ? " -- TOO SHORT, add ?delay=" + (p95 + 0.1).toFixed(2) : "")
    + "; VRM drawn at " + fpsSeen + " fps";
}, 1000);

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  startAudio();
  const el = document.getElementById("line");
  const text = el.value.trim();
  if (!text) return;
  el.value = "";
  try {
    await fetch("/say", {method: "POST", headers: {"Content-Type": "application/json"},
                         body: JSON.stringify({text})});
  } catch (err) { log("send failed: " + err); }
});

// One ping at a time: a timer firing every 2 s piled up requests behind a
// slow tunnel (262 ms ping) until the browser's six connections to the
// server were all pending and nothing, /say included, got through.
async function pingLoop() { await ping(); setTimeout(pingLoop, 2000); }

(async () => {
  cfg = await (await fetch("/avatar.json", {cache: "no-store"})).json();
  // The avatar (11 MB for the sample) first, before the long-lived streams
  // take connections: over a slow link the download otherwise shared the
  // link with them and the page sat black at 0 fps.
  log("loading avatar...");
  try { av = await loadAvatar("/avatar.vrm", vcv, cfg.camera, { bg: cfg.bg }); window.TSK_AV = av; log("avatar loaded"); }
  catch (e) { log("VRM: " + e); console.error(e); }
  if (cfg.avatar === "both") { document.getElementById("l2dStage").hidden = false; video(); }
  for (let i = 0; i < 5; i++) await ping();
  pingLoop();
  events();
  stateStream();
  requestAnimationFrame(drawLoop);
})();
</script>
</body>
</html>
